# Serves the OTT Stream Monitor SPA and reverse-proxies the API.
#
# The web container runs with host networking, so the FastAPI backend (also host
# networking) is reachable on 127.0.0.1:8080. The /api prefix is preserved and
# passed through unchanged — the backend (FastAPI root_path="/api") expects it,
# exactly like the Replit shared proxy in development.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reasonable upload ceiling for SDP/pairing payloads.
    client_max_body_size 16m;

    # API, SSE and WebRTC-WHEP proxy -> FastAPI backend (path NOT rewritten).
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events (/api/stream/status) + streaming responses:
        # disable buffering and allow long-lived connections.
        proxy_set_header Connection "";
        proxy_buffering   off;
        proxy_cache       off;
        proxy_read_timeout  24h;
        proxy_send_timeout  24h;
    }

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
