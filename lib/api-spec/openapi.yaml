openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: OTT Stream Monitor API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: devices
    description: OTT device management
  - name: hls-streams
    description: HLS source stream management
  - name: check-results
    description: Health check result history
  - name: incidents
    description: Incident tracking
  - name: settings
    description: System configuration
  - name: dashboard
    description: Aggregated dashboard data
  - name: auth
    description: Authentication and session
  - name: users
    description: User account management (admin only)
  - name: guacamole
    description: Guacamole remote session management
  - name: remote
    description: Native OTT device remote control
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Devices
  /devices:
    get:
      operationId: listDevices
      tags: [devices]
      summary: List all devices
      responses:
        "200":
          description: List of devices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"
    post:
      operationId: createDevice
      tags: [devices]
      summary: Create a device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"

  /devices/{id}:
    get:
      operationId: getDevice
      tags: [devices]
      summary: Get a device
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "404":
          description: Not found
    patch:
      operationId: updateDevice
      tags: [devices]
      summary: Update a device
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceUpdate"
      responses:
        "200":
          description: Updated device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
    delete:
      operationId: deleteDevice
      tags: [devices]
      summary: Delete a device
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /devices/{id}/stats/{window}:
    get:
      operationId: getDeviceStats
      tags: [devices]
      summary: Get uptime and MTTR stats for a device
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: window
          in: path
          required: true
          schema:
            type: string
          description: "Time window: 24h, 7d, or 30d"
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemStats"

  /devices/{id}/latest-check:
    get:
      operationId: getDeviceLatestCheck
      tags: [devices]
      summary: Get most recent check result for a device
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Latest check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckResult"

  # Native remote control
  /devices/{id}/remote/status:
    get:
      operationId: getRemoteStatus
      tags: [remote]
      summary: Reachability and pairing status of a device's native remote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Remote status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteStatus"

  /devices/{id}/remote/capabilities:
    get:
      operationId: getRemoteCapabilities
      tags: [remote]
      summary: Supported keys and apps for a device's native remote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Remote capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteCapabilities"

  /devices/{id}/remote/key:
    post:
      operationId: sendRemoteKey
      tags: [remote]
      summary: Send a remote key press to a device
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoteKeyInput"
      responses:
        "200":
          description: Action result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteActionResult"

  /devices/{id}/remote/launch:
    post:
      operationId: launchRemoteApp
      tags: [remote]
      summary: Launch an app on a device
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoteLaunchInput"
      responses:
        "200":
          description: Action result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteActionResult"

  /devices/{id}/remote/pair/begin:
    post:
      operationId: beginRemotePairing
      tags: [remote]
      summary: Begin pairing for a device's native remote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Pairing started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemotePairBegin"

  /devices/{id}/remote/pair/finish:
    post:
      operationId: finishRemotePairing
      tags: [remote]
      summary: Finish pairing for a device's native remote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemotePairFinishInput"
      responses:
        "200":
          description: Remote status after pairing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteStatus"

  # HLS Streams
  /hls-streams:
    get:
      operationId: listHlsStreams
      tags: [hls-streams]
      summary: List all HLS streams
      responses:
        "200":
          description: List of HLS streams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HlsStream"
    post:
      operationId: createHlsStream
      tags: [hls-streams]
      summary: Create an HLS stream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HlsStreamInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HlsStream"

  /hls-streams/{id}:
    get:
      operationId: getHlsStream
      tags: [hls-streams]
      summary: Get an HLS stream
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: HLS stream
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HlsStream"
        "404":
          description: Not found
    patch:
      operationId: updateHlsStream
      tags: [hls-streams]
      summary: Update an HLS stream
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HlsStreamUpdate"
      responses:
        "200":
          description: Updated HLS stream
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HlsStream"
    delete:
      operationId: deleteHlsStream
      tags: [hls-streams]
      summary: Delete an HLS stream
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /hls-streams/{id}/stats/{window}:
    get:
      operationId: getHlsStreamStats
      tags: [hls-streams]
      summary: Get uptime and MTTR stats for an HLS stream
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: window
          in: path
          required: true
          schema:
            type: string
          description: "Time window: 24h, 7d, or 30d"
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemStats"

  /hls-streams/{id}/latest-check:
    get:
      operationId: getHlsStreamLatestCheck
      tags: [hls-streams]
      summary: Get most recent check result for an HLS stream
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Latest check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckResult"

  # Check Results
  /check-results:
    get:
      operationId: listCheckResults
      tags: [check-results]
      summary: List check results
      parameters:
        - name: device_id
          in: query
          schema:
            type: ["integer", "null"]
        - name: hls_stream_id
          in: query
          schema:
            type: ["integer", "null"]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: List of check results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CheckResult"

  # Incidents
  /incidents:
    get:
      operationId: listIncidents
      tags: [incidents]
      summary: List incidents
      parameters:
        - name: device_id
          in: query
          schema:
            type: ["integer", "null"]
        - name: hls_stream_id
          in: query
          schema:
            type: ["integer", "null"]
        - name: status
          in: query
          schema:
            type: ["string", "null"]
            enum: [open, resolved, null]
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: List of incidents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Incident"

  /incidents/{id}:
    get:
      operationId: getIncident
      tags: [incidents]
      summary: Get an incident
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Incident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"

  /incidents/{id}/acknowledge:
    patch:
      operationId: acknowledgeIncident
      tags: [incidents]
      summary: Acknowledge an active incident
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcknowledgeInput"
      responses:
        "200":
          description: Acknowledged incident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"

  # Settings
  /settings:
    get:
      operationId: listSettings
      tags: [settings]
      summary: List all settings
      responses:
        "200":
          description: All settings as key-value pairs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Setting"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update one or more settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Setting"

  # Dashboard
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get aggregated dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  # Guacamole Sessions
  /guacamole-sessions:
    get:
      operationId: listGuacamoleSessions
      tags: [guacamole]
      summary: List all Guacamole sessions
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GuacamoleSession"
    post:
      operationId: createGuacamoleSession
      tags: [guacamole]
      summary: Create a Guacamole session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuacamoleSessionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuacamoleSession"

  /guacamole-sessions/{id}:
    patch:
      operationId: updateGuacamoleSession
      tags: [guacamole]
      summary: Update a Guacamole session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuacamoleSessionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuacamoleSession"
    delete:
      operationId: deleteGuacamoleSession
      tags: [guacamole]
      summary: Delete a Guacamole session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /dashboard/recent-incidents:
    get:
      operationId: getDashboardRecentIncidents
      tags: [dashboard]
      summary: Get recent incidents for dashboard feed
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Recent incidents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Incident"

  # Auth
  /auth/config:
    get:
      operationId: getAuthConfig
      tags: [auth]
      summary: Public auth configuration (SSO availability)
      responses:
        "200":
          description: Auth config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfig"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with a local username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out the current session
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the currently authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated

  # Users (admin only)
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a local user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

components:
  schemas:
    AuthConfig:
      type: object
      required: [sso_enabled, sso_label]
      properties:
        sso_enabled:
          type: boolean
        sso_label:
          type: string

    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    User:
      type: object
      required: [id, username, role, auth_provider, is_active, created_at]
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
          nullable: true
        full_name:
          type: string
          nullable: true
        role:
          type: string
        auth_provider:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time
          nullable: true

    UserInput:
      type: object
      required: [username]
      properties:
        username:
          type: string
        password:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        full_name:
          type: string
          nullable: true
        role:
          type: string
          default: operator

    UserUpdate:
      type: object
      properties:
        email:
          type: string
          format: email
          nullable: true
        full_name:
          type: string
          nullable: true
        role:
          type: string
          nullable: true
        is_active:
          type: boolean
          nullable: true
        password:
          type: string
          nullable: true

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Device:
      type: object
      required: [id, name, platform, srs_stream_key, srs_app, enabled, current_status]
      properties:
        id:
          type: integer
        name:
          type: string
        platform:
          type: string
          enum: [roku, firetv, chromecast, appletv, other]
        srs_stream_key:
          type: string
        srs_app:
          type: string
        enabled:
          type: boolean
        webrtc_url:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        ip_address:
          type: ["string", "null"]
        current_status:
          type: string
          enum: [HEALTHY, WARNING, DOWN, UNKNOWN]
        last_checked_at:
          type: ["string", "null"]
        failure_reason:
          type: ["string", "null"]
        remote_protocol:
          type: ["string", "null"]
        remote_capable:
          type: boolean
        remote_requires_pairing:
          type: boolean
        remote_paired:
          type: boolean

    DeviceInput:
      type: object
      required: [name, platform, srs_stream_key]
      properties:
        name:
          type: string
        platform:
          type: string
          enum: [roku, firetv, chromecast, appletv, other]
        srs_stream_key:
          type: string
        srs_app:
          type: string
          default: live
        enabled:
          type: boolean
          default: true
        webrtc_url:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        ip_address:
          type: ["string", "null"]

    DeviceUpdate:
      type: object
      properties:
        name:
          type: ["string", "null"]
        platform:
          type: ["string", "null"]
          enum: [roku, firetv, chromecast, appletv, other, null]
        srs_stream_key:
          type: ["string", "null"]
        srs_app:
          type: ["string", "null"]
        enabled:
          type: ["boolean", "null"]
        webrtc_url:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        ip_address:
          type: ["string", "null"]

    HlsStream:
      type: object
      required: [id, name, master_url, enabled, is_encrypted, current_status]
      properties:
        id:
          type: integer
        name:
          type: string
        master_url:
          type: string
        enabled:
          type: boolean
        expected_renditions:
          type: ["integer", "null"]
        is_encrypted:
          type: boolean
        notes:
          type: ["string", "null"]
        current_status:
          type: string
          enum: [HEALTHY, WARNING, DOWN, UNKNOWN]
        last_checked_at:
          type: ["string", "null"]
        failure_reason:
          type: ["string", "null"]

    HlsStreamInput:
      type: object
      required: [name, master_url]
      properties:
        name:
          type: string
        master_url:
          type: string
        enabled:
          type: boolean
          default: true
        expected_renditions:
          type: ["integer", "null"]
        is_encrypted:
          type: boolean
          default: false
        notes:
          type: ["string", "null"]

    HlsStreamUpdate:
      type: object
      properties:
        name:
          type: ["string", "null"]
        master_url:
          type: ["string", "null"]
        enabled:
          type: ["boolean", "null"]
        expected_renditions:
          type: ["integer", "null"]
        is_encrypted:
          type: ["boolean", "null"]
        notes:
          type: ["string", "null"]

    CheckResult:
      type: object
      required: [id, timestamp, status]
      properties:
        id:
          type: integer
        device_id:
          type: ["integer", "null"]
        hls_stream_id:
          type: ["integer", "null"]
        timestamp:
          type: string
        status:
          type: string
          enum: [HEALTHY, WARNING, DOWN, UNKNOWN]
        detail:
          type: object
          additionalProperties: true
        frame_thumbnail_path:
          type: ["string", "null"]

    Incident:
      type: object
      required: [id, started_at, status, reason]
      properties:
        id:
          type: integer
        device_id:
          type: ["integer", "null"]
        hls_stream_id:
          type: ["integer", "null"]
        device_name:
          type: ["string", "null"]
        hls_stream_name:
          type: ["string", "null"]
        item_type:
          type: ["string", "null"]
          enum: [device, hls_stream, null]
        started_at:
          type: string
        resolved_at:
          type: ["string", "null"]
        status:
          type: string
          enum: [open, resolved]
        reason:
          type: string
        acknowledged_by:
          type: ["string", "null"]

    AcknowledgeInput:
      type: object
      required: [acknowledged_by]
      properties:
        acknowledged_by:
          type: string

    Setting:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
        value:
          type: string
        description:
          type: ["string", "null"]

    SettingsUpdate:
